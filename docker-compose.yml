services:
  deskswap:
    build: .
    container_name: deskswap
    ports:
      - "0.0.0.0:${CONTAINER_PORT:-8080}:8080"
    volumes:
      - ${HOST_PATH:-/home/user}:/home/user
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
